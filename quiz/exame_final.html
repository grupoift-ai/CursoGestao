<!DOCTYPE html><html lang="pt-PT"><head><meta charset="utf-8"><title>Exame Final</title><link rel="stylesheet" href="../assets/css/style.css"><script src="../assets/js/scorm_api.js"></script></head><body><header><h1>Exame Final</h1><p>Contabilidade para Gestão</p></header><main class="wrap"><h2>Questionário final</h2><div class="card"><p><b>1. Qual documento deve pedir para análise mensal detalhada?</b></p><select id="q1"><option>Balancete analítico</option><option>Fatura isolada</option><option>Recibo de vencimento</option></select></div><div class="card"><p><b>2. Lucro elevado e caixa baixo indicam frequentemente:</b></p><select id="q2"><option>Clientes por receber</option><option>IVA como lucro</option><option>Capital próprio excessivo</option></select></div><div class="card"><p><b>3. Liquidez geral calcula-se por:</b></p><select id="q3"><option>Ativo corrente / Passivo corrente</option><option>Passivo / Ativo</option><option>Resultado / Vendas</option></select></div><div class="card"><p><b>4. ROE mede:</b></p><select id="q4"><option>Rentabilidade do capital próprio</option><option>Peso dos fornecedores</option><option>IVA a pagar</option></select></div><div class="card"><p><b>5. EBITDA exclui:</b></p><select id="q5"><option>Depreciações e amortizações</option><option>Vendas</option><option>Clientes</option></select></div><button onclick="corrigir()">Submeter exame</button><p id="resultado"></p><script>const respostas={"q1": "Balancete analítico", "q2": "Clientes por receber", "q3": "Ativo corrente / Passivo corrente", "q4": "Rentabilidade do capital próprio", "q5": "Depreciações e amortizações"};function corrigir(){let pontos=0;let total=Object.keys(respostas).length;for(const id in respostas){if(document.getElementById(id).value===respostas[id])pontos++;}let score=Math.round(pontos/total*100);document.getElementById('resultado').innerHTML='Pontuação: '+score+'%';SCORM_SetValue('cmi.core.score.raw',score);SCORM_SetValue('cmi.core.lesson_status',score>=70?'passed':'failed');SCORM_Commit();}</script><p><a class="btn secondary" href="../index.html">Voltar ao início</a></p></main></body></html>
